[project]
name = "mimic-bhc-extraction"
version = "0.1.0"
description = "Extract Brief Hospital Course sections from MIMIC discharge summaries"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Christian Garbin" }]
dependencies = [
    "duckdb",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov", "pre-commit"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/mimic_bhc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[project.scripts]
mimic-bhc-extract = "mimic_bhc.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",      # pydocstyle
    "COM812", # trailing comma (conflicts with formatter)
    "ISC001", # implicit string concat (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "PLR2004", # magic values allowed in tests
    "ANN",     # annotations optional in tests
    "PD901",   # generic df name is fine in tests
    "S608",    # SQL injection false positives (DuckDB read_csv_auto on local files)
    "PLC0415", # imports inside fixtures/tests for test isolation
    "PTH123",  # open() is fine in tests
    "PERF401", # append-in-loop is fine in tests (clarity over micro-optimization)
    "PLR0913", # test helpers need many keyword args for clarity
]
"src/mimic_bhc/cli.py" = [
    "T201",    # print is the output mechanism for CLI
    "PLC0415", # lazy import of BHCResult/compute_bhc_stats in stats subcommand
]
"src/mimic_bhc/model.py" = [
    "PLC0415", # lazy import of StructureResult in from_dict to avoid circular import
]
"src/mimic_bhc/batch.py" = [
    "FBT001",  # is_mimic3 bool parameter needed for version branching
    "PLC0415", # runtime pandas import in functions that need it (kept out of top-level)
    "PLR0913", # _process_note receives pre-computed fields from caller
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/mimic_bhc"]
